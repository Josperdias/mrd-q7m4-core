name: Collect official document catalogue
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collector.py --output catalogue/catalog-collected.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-catalogue-for-review
          path: catalogue/
          retention-days: 30
