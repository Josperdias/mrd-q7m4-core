name: Android package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dist/**', 'android/**', 'scripts/build-android.sh', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          SDKM="$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MERIDIAN_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MERIDIAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MERIDIAN_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MERIDIAN_VERSION_CODE: ${{ github.run_number }}
          MERIDIAN_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export MERIDIAN_KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            echo "No signing secrets found: using a throwaway development key."
          fi
          bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-Android-development
          path: android/build/Meridian-1.0.0.apk
          retention-days: 30
      - name: Publish APK to the public release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/build/Meridian-1.0.0.apk
          SUM="$(sha256sum "$APK" | cut -d' ' -f1)"
          printf '{"versionCode":%s,"versionName":"1.0.%s","sha256":"%s","commit":"%s"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$SUM" "$GITHUB_SHA" > "$RUNNER_TEMP/update.json"
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest "$APK" "$RUNNER_TEMP/update.json" \
            --target "$GITHUB_SHA" \
            --title "Meridian 1.0.$GITHUB_RUN_NUMBER (APK)" \
            --notes "APK built by GitHub Actions from commit $GITHUB_SHA ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Version 1.0.$GITHUB_RUN_NUMBER (build $GITHUB_RUN_NUMBER). SHA-256: $SUM"
